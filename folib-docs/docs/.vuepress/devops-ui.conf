map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream websocket {
    server localhost:9529;
}
server {
    listen 9529;
    server_name localhost;
    root /dist;
    index index.html;
    try_files $uri $uri/ /index.html;
        location /api/ {
            proxy_pass http://192.168.5.165:9999/;
            client_max_body_size    2000m;
        }

}

