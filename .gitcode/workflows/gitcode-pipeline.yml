name: Maven build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: euleros-2.10.1
    steps:
    - uses: checkout-action@0.0.1
    - name: Set up JDK
      uses: setup-java@0.0.1
      with:
        java-version: '17.0.2'
    - name: Build with Maven
      run: sh ./folib-package.sh
