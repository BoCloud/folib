server:
  port: 38080
  connection-timeout: 50000
  session:
      timeout: 50000
  jetty:
    max-http-form-post-size: 524288000 # Maximum size in bytes of the HTTP post or put content.
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${folib.mysql.host:127.0.0.1}:${folib.mysql.port:3306}/${folib.mysql.db:folib_scanner}?createDatabaseIfNotExist=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF8
    username: ${folib.mysql.user:root}
    password: ${folib.mysql.password:123456}
    schema: classpath:db/sql/database-init.sql
  liquibase:
      change-log: classpath:db/changelog-master.xml

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      enabled: true

mybatis:
  mapper-locations: "classpath*:mapper/*.xml"

mapper:
  mappers: com.veadan.folib.scanner.common.base.CommonMapper
  identity: MYSQL

scan:
  base-proxy: ${folib.nvd:nvd.folib.com}    #扫描网络代理地址
  storage-base: ${folib.vault}/
  thread-pool: 200

folib:
  basedir: .
  home: ${folib.basedir}/folib
  vault: ${folib.basedir}/folib-vault
  etc: ${folib.home}/etc
  temp: ${folib.home}/tmp
  multipart:
    maxFileSize: 2048             # 单个上传文件大小 （MB）
    maxRequestSize: 2048        # 单次个上传文件总大小 （MB）
  cluster:
    openflag: ${folib.openflag:true}
  docker:
    getAppPackagePathConfig: usr/local/app # docker 扫描提供获取指定路径下的应用包 多个路径逗号隔开
  distributed:
    lockip: ${folib.scheduled.lockip:10.8.10.166} # 实例 host ip
  config:
    file: ${folib.home}/etc/conf/folib.yaml
  storage:
    booter:
      basedir: ${folib.vault}/storages
  host: localhost
  port: 38080
  dependentLibraryPrefix: anhui
  dependentPushUrl: http://172.29.63.45:9022
  nuget:
    download:
      feed: false
  version: @{project.version}
  revision: @{folib.revision}
  users:
    external:
      cache:
        seconds: 3600
  sse:
    timeoutMillis: 600000
  graph:
    gremlin:
        server:
            enabled: true
  threadPool:
    async:
      corePoolSize: 20
      maxPoolSize: 200
      queueCapacity: 200
      keepAliveSeconds: 200
      threadNamePrefix: async_
      awaitTerminationSeconds: 60
    asyncEventListener:
      corePoolSize: 20
      maxPoolSize: 200
      queueCapacity: 1000
      keepAliveSeconds: 200
      threadNamePrefix: asyncEventListener_
      awaitTerminationSeconds: 60
    asyncStorage:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 25
      keepAliveSeconds: 200
      threadNamePrefix: asyncStorage_
      awaitTerminationSeconds: 60
    asyncRepository:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 25
      keepAliveSeconds: 200
      threadNamePrefix: asyncRepository_
      awaitTerminationSeconds: 60
    asyncSecurityPolicy:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 25
      keepAliveSeconds: 200
      threadNamePrefix: asyncSecurityPolicyConfig_
      awaitTerminationSeconds: 60
    asyncConfig:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 200
      keepAliveSeconds: 200
      threadNamePrefix: asyncConfig_
      awaitTerminationSeconds: 60
    asyncRepositoryCleanup:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 100000000
      keepAliveSeconds: 200
      threadNamePrefix: asyncRepositoryCleanup_
      awaitTerminationSeconds: 120
    asyncCronJob:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 10000
      keepAliveSeconds: 200
      threadNamePrefix: asyncCronJob_
      awaitTerminationSeconds: 120
    asyncClusterDispatch:
      corePoolSize: 10
      maxPoolSize: 200
      queueCapacity: 10000
      keepAliveSeconds: 200
      threadNamePrefix: asyncClusterDispatch_
      awaitTerminationSeconds: 120
# Changes to these properties must also be applied to [folib/folib-web-integration-tests] and possibly the pipeline.
# Please ping us on our chat channel (https://chat.carlspring.org/) to confirm.
logging:
  debug: false
  console:
    enabled: true
  file:
    name: ${logging.dir}/folib.log
    enabled: true
    size:
      single: 128MB
      total: 1GB
    history: 31
  dir: ${folib.vault}/logs
java:
  io:
    tmpdir: ${folib.vault}/tmp
ehcache:
  disk:
    store:
      dir: ${folib.vault}/cache
management:
  health:
    neo4j:
      enabled: false
    ldap:
      enabled: false
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,beans,metrics,trace,scheduledtasks,threaddump,loggers,startup
      base-path: /api/monitoring
cacheManagerConfiguration:
  groupConfig:
    name: folib
    password: password
  enableMulticastConfig: false
  multicast:
    multicastGroup: 224.2.2.3
    multicastPort: 54327
    multicastTimeoutSeconds: 2
    multicastTimeToLive: 32
    trustedInterfaces: en0,en1
    loopbackModeEnabled: false
  instanceId: folib
  caches:
    remoteRepositoryAliveness:
      maxSizeLimit: 1000
      maxSizePolicy: FREE_HEAP_SIZE
      evictionPolicy: LFU
    tags:
      maxSizeLimit: 1000
      maxSizePolicy: FREE_HEAP_SIZE
      evictionPolicy: LFU
    authentications:
      cacheLocalEntries: true
      evictionConfigSize: 1000
      evictionConfigMaxSizePolicy: ENTRY_COUNT
      invalidateOnChange: true
      timeToLiveSeconds: 10
s3fs:
  protocol: http
  region: bo-nj-cn
  uri: s3://localhost:9000/
  access:
    key: folib@pjzy
  secret:
    key: folib@pjzy
