host: 0.0.0.0
port: 8182
evaluationTimeout: 30000
channelizer: org.apache.tinkerpop.gremlin.server.channel.WebSocketChannelizer
graphManager: org.janusgraph.graphdb.management.JanusGraphManager
graphs: {}
scriptEngines:
  gremlin-groovy:
    plugins:
      org.janusgraph.graphdb.tinkerpop.plugin.JanusGraphGremlinPlugin: {}
      org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {}
      org.apache.tinkerpop.gremlin.jsr223.ImportGremlinPlugin:
        classImports:
          - java.lang.Math
          - org.opencypher.gremlin.traversal.CustomFunctions
          - org.opencypher.gremlin.traversal.CustomPredicate
        methodImports:
          - java.lang.Math#*
          - org.opencypher.gremlin.traversal.CustomPredicate#*
          - org.opencypher.gremlin.traversal.CustomFunctions#*
serializers:
#  - className: org.apache.tinkerpop.gremlin.driver.ser.GryoMessageSerializerV3d0
#    config:
#      ioRegistries:
#        - org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry
#  - className: org.apache.tinkerpop.gremlin.driver.ser.GryoMessageSerializerV3d0
#    config:
#      serializeResultToString: true
#  - className: org.apache.tinkerpop.gremlin.driver.ser.GraphSONMessageSerializerV3d0
#    config:
#      ioRegistries:
#        - org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry
   - className: org.apache.tinkerpop.gremlin.driver.ser.GraphBinaryMessageSerializerV1
     config:
       ioRegistries:
         - org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry
   - className: org.apache.tinkerpop.gremlin.driver.ser.GraphBinaryMessageSerializerV1
     config:
       serializeResultToString: true
   - className: org.apache.tinkerpop.gremlin.driver.ser.GraphSONMessageSerializerV3d0
     config:
       ioRegistries:
         - org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry
processors:
  - className: org.apache.tinkerpop.gremlin.server.op.session.SessionOpProcessor
    config:
      sessionTimeout: 28800000
  - className: org.apache.tinkerpop.gremlin.server.op.traversal.TraversalOpProcessor
    config:
      cacheExpirationTime: 600000
      cacheMaxSize: 1000
maxInitialLineLength: 4096
maxHeaderSize: 8192
maxChunkSize: 8192
maxContentLength: 65536
maxAccumulationBufferComponents: 1024
resultIterationBatchSize: 64
writeBufferLowWaterMark: 32768
writeBufferHighWaterMark: 65536
