configuration:
  instanceName: folib
  version: ${project.version}
  revision: ${folib.revision}
  baseUrl: http://localhost:38080/
  port: 38080
  sessionConfiguration:
    timeoutSeconds: 3600
  remoteRepositoriesConfiguration:
    checkIntervalSeconds: 60
    heartbeatThreadsNumber: 5
    retryArtifactDownloadConfiguration:
      timeoutSeconds: 60
      maxNumberOfAttempts: 5
      minAttemptsIntervalSeconds: 5
  corsConfiguration:
    allowedCredentials: true
    maxAge: 600
    allowedOrigins:
      - "*"
    allowedMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
    allowedHeaders:
      - Accept
      - Accepts
      - Authorization
      - Access-Control-Allow-Headers
      - Access-Control-Request-Headers
      - Access-Control-Request-Method
      - DNT
      - Keep-Alive
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Content-Range,Range
  storages:
    folib-default:
      id: folib-default
      repositories:
        releases-maven:
          id: releases-maven
          policy: release
          storageProvider: local
          layout: Maven 2
          type: hosted
          allowsForceDeletion: true
          checksumHeadersEnabled: true
          repositoryConfiguration:
            type: Maven 2
            indexingEnabled: true
            cronExpression: "0 0 2 * * ?"
        snapshots-maven:
          id: snapshots-maven
          policy: snapshot
          storageProvider: local
          layout: Maven 2
          type: hosted
          secured: true
          checksumHeadersEnabled: true
          repositoryConfiguration:
            type: Maven 2
            indexingEnabled: true
            cronExpression: "0 0 2 * * ?"
    folib-common:
      id: folib-common
      repositories:
        central-maven:
          id: central-maven
          policy: release
          storageProvider: local
          layout: Maven 2
          type: proxy
          remoteRepository:
            url: https://repo.maven.apache.org/maven2/
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
          repositoryConfiguration:
            type: Maven 2
            indexingEnabled: true
            cronExpression: "0 0 2 * * ?"
        aliyun-maven:
          id: aliyun-maven
          policy: mixed
          storageProvider: local
          layout: Maven 2
          type: proxy
          remoteRepository:
            url: http://maven.aliyun.com/nexus/content/repositories/central/
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
        typesafe-releases-ivy:
          id: typesafe-releases-ivy
          policy: release
          storageProvider: local
          layout: Maven 2
          type: proxy
          remoteRepository:
            url: https://repo.typesafe.com/typesafe/ivy-releases
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
        jboss-releases-maven:
          id: jboss-releases-maven
          policy: release
          storageProvider: local
          layout: Maven 2
          type: proxy
          remoteRepository:
            url: http://repository.jboss.org/nexus/content/groups/public-jboss/
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
        nuget.org-nuget:
          id: nuget.org-nuget
          policy: release
          storageProvider: local
          layout: NuGet
          type: proxy
          remoteRepository:
            url: https://www.nuget.org/api/v2
          repositoryConfiguration:
            type: NuGet
            remoteFeedPageSize: 1000
        taobao-npm:
          id: taobao-npm
          policy: release
          storageProvider: local
          layout: npm
          type: proxy
          remoteRepository:
            url: https://registry.npm.taobao.org
            customConfiguration:
              type: npm
              lastChangeId: 0
              replicateUrl: https://registry.npm.taobao.org
        taobao-yarn:
          id: taobao-yarn
          policy: release
          storageProvider: local
          layout: npm
          type: proxy
          remoteRepository:
            url: https://registry.npm.taobao.org
            customConfiguration:
              type: npm
              lastChangeId: 0
              replicateUrl: https://registry.npm.taobao.org
        plugin-releases-sbt:
          id: plugin-releases-sbt
          policy: release
          storageProvider: local
          layout: Maven 2
          type: proxy
          remoteRepository:
            url: https://repo.scala-sbt.org/scalasbt/sbt-plugin-releases
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
        python-local-pypi:
          id: python-local-pypi
          policy: release
          storageProvider: local
          layout: PyPi
          type: hosted
          allowsForceDeletion: true
          checksumHeadersEnabled: true
        python-proxy-pypi:
          id: python-proxy-pypi
          policy: release
          storageProvider: local
          layout: PyPi
          type: proxy
          remoteRepository:
            url: https://pypi.tuna.tsinghua.edu.cn/simple
            downloadRemoteIndexes: true
            autoBlocking: true
            checksumValidation: true
  routingRules:
    rules:

